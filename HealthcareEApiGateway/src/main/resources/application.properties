server.port=9001
spring.application.name=API-GATEWAY

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ✅ PATIENT SERVICE ROUTE
spring.cloud.gateway.routes[0].id=patient-service
spring.cloud.gateway.routes[0].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/patients/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=name=patientCB,fallbackUri=forward:/fallback/patient

# ✅ APPOINTMENT SERVICE ROUTE
spring.cloud.gateway.routes[1].id=appointment-service
spring.cloud.gateway.routes[1].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/appointments/**
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=name=appointmentCB,fallbackUri=forward:/fallback/appointment

# ✅ Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
